# Secret scan: gitleaks over the full history of main, once a night and by hand. Inlined from the org standard
# (big-minds-tiny-hands/.github pr-hygiene.yml) because a public repository cannot call a reusable workflow that lives
# in a private one. Pull requests run no CI until Tiny has its first real record in production (ENG-3563), so the
# PR-text and changed-file guards are gone. The conventional PR title is a Mergify merge protection (.mergify.yml).
name: PR hygiene

on:
  schedule:
    - cron: "59 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: PR hygiene / checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config .gitleaks.toml); fi
          "$RUNNER_TEMP/gitleaks" git . "${config[@]}" --no-banner --redact --exit-code 1
