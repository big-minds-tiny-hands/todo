# After each production deploy, check that every production URL can reach auth.
# A wrong SITE_URL or TRUSTED_ORIGINS on the production Convex deployment fails
# every sign-in and sign-up with 403 INVALID_ORIGIN, and nothing else catches it.
name: Auth origin

on:
  deployment_status:

permissions:
  contents: read

jobs:
  check:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check production origins
        run: node scripts/check-auth-origin.mjs https://todo-kappa-eight-48.vercel.app https://todo-big-minds-tiny-hands.vercel.app
