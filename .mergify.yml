# No merge queue until Tiny has its first real record in production
# (ENG-3563): pull requests run no CI, so a queue would wait on checks that
# never arrive. A PR with the `queue` label merges on its own once the
# protections below pass. The org base in big-minds-tiny-hands/.github (CI-STANDARD.md) is copied in
# here, not extended: that repo is private and this one is public, and Mergify
# refuses a private base for a public repo.

merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions:
    - label = queue

merge_protections:
  - name: Not held
    description: A draft or a do-not-merge label keeps a PR out of the default branch.
    if:
      - base = main
    success_conditions:
      - -draft
      - -label = do-not-merge
  # The squash commit is the PR title (commit_message_format in the org base).
  # Same types as @commitlint/config-conventional.
  - name: Conventional PR title
    description: The PR title is a Conventional Commit, because it becomes the squash commit.
    if:
      - base = main
    success_conditions:
      - "title ~= ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]+\\))?!?: \\S"
