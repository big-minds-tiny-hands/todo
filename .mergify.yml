# Merge queue: squash merges, re-tested against the latest main. A PR enters
# with the `queue` label (auto-merge below) or by commenting `@mergifyio queue`.
# The org base in big-minds-tiny-hands/.github (CI-STANDARD.md) is copied in
# here, not extended: that repo is private and this one is public, and Mergify
# refuses a private base for a public repo.

defaults:
  queue_rule:
    batch_size: 1
    max_checks_retries: 0
    merge_method: squash
    update_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body

merge_queue:
  max_parallel_checks: 1
  reset_on_external_merge: always

queue_rules:
  - name: default
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - head-repo-full-name = big-minds-tiny-hands/todo
      - -draft
      - check-success = Quality gate
      - check-success = PR hygiene / checks

merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions:
    - label = queue

merge_protections:
  - name: Not held
    description: A draft or a do-not-merge label keeps a PR out of the default branch.
    if:
      - base = main
    success_conditions:
      - -draft
      - -label = do-not-merge
  # The squash commit is the PR title (commit_message_format in the org base).
  # Same types as @commitlint/config-conventional.
  - name: Conventional PR title
    description: The PR title is a Conventional Commit, because it becomes the squash commit.
    if:
      - base = main
    success_conditions:
      - "title ~= ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]+\\))?!?: \\S"
